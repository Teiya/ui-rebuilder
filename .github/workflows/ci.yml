name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src scripts
      - run: python -m unittest discover -s tests -v
      - run: python examples/minimal/create_reference.py
      - run: ui-rebuilder build examples/minimal/minimal.job.yaml --output Output/minimal --skip-openpencil
      - run: ui-rebuilder validate Output/minimal
      - run: python examples/multi-project/create_reference.py
      - run: ui-rebuilder workspace plan examples/multi-project/workspace.yaml
      - run: ui-rebuilder workspace build examples/multi-project/workspace.yaml --max-workers 3 --skip-openpencil
      - run: ui-rebuilder workspace validate examples/multi-project/workspace.yaml
      - run: python scripts/bootstrap.py --profile all --install-comfy-python --dry-run
