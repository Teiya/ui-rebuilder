[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-rebuilder"
version = "0.1.0"
description = "Project-agnostic reconstruction pipeline from flattened UI references to editable UIIR and OpenPencil design sources."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
  "jsonschema>=4.20",
  "Pillow>=10.0",
  "PyYAML>=6.0"
]

[project.scripts]
ui-rebuilder = "ui_rebuilder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ui_rebuilder = ["templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
